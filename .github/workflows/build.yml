name: Windows build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test isolated fixtures
        shell: cmd
        run: .\test.cmd
      - name: Build application
        shell: cmd
        run: .\build.cmd
      - name: Build and verify installer
        shell: powershell
        run: |
          .\scripts\build-installer.ps1
          $report = Join-Path $PWD 'tests\results\installer-test.txt'
          $setup = Start-Process -FilePath (Join-Path $PWD 'dist\BF4 Central Setup.exe') -ArgumentList @('--self-test', ('"' + $report + '"')) -Wait -PassThru -WindowStyle Hidden
          Get-Content -LiteralPath $report
          if ($setup.ExitCode -ne 0) { throw 'Installer self-test failed' }
      - name: Upload executable and test results
        uses: actions/upload-artifact@v4
        with:
          name: bf4-central-windows
          path: |
            dist/BF4 Central.exe
            dist/BF4 Central Setup.exe
            tests/results/
