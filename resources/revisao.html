<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BF4 Central · Revisão de partida</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e8edf0;color:#1e3442;font:16px 'Segoe UI',sans-serif}
main{max-width:1100px;margin:auto;padding:24px}h1{font:600 2rem Bahnschrift,'Segoe UI',sans-serif;margin:0 0 12px}
.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:12px 0}
button{background:#fff;border:1px solid #788c98;color:inherit;padding:8px 12px;font:inherit}button:disabled{opacity:.55}
:focus-visible{outline:3px solid #a34d14;outline-offset:2px}
#stage{position:relative;background:#111}video{display:block;width:100%}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#seek{flex:1;min-width:120px}p{color:#4d626e}
</style>
<main>
<h1>Revisão de partida</h1>
<label>Gravação de espectador <input id="file" type="file" accept="video/*,.mp4"></label>
<p>Pause e arraste sobre o personagem. Marque novamente quando ele mudar de posição ou tamanho. A caixa acompanha a transição entre as marcações.</p>
<div id="stage" hidden>
<video id="video" playsinline preload="metadata"></video>
<canvas id="layer" aria-label="Área de marcação do vídeo"></canvas>
</div>
<div class="controls">
<button id="play" disabled>Reproduzir</button>
<input id="seek" type="range" min="0" max="0" step=".01" value="0" aria-label="Posição na gravação" disabled>
<output id="time">0,00 s</output>
</div>
<div class="controls">
<label><input id="visible" type="checkbox" checked> Mostrar caixa verde</label>
<button id="hide" disabled>Ocultar a partir daqui</button>
<button id="undo" disabled>Desfazer última marcação</button>
</div>
<p id="status" role="status">Abra um vídeo local para começar.</p>
</main>
<script>
'use strict';
const byId = id => document.getElementById(id);
const video = byId('video'), layer = byId('layer'), ctx = layer.getContext('2d');
const seek = byId('seek'), play = byId('play'), status = byId('status');
const undo = byId('undo'), hide = byId('hide'), visible = byId('visible');
let url, marks = [], history = [], drag = null, frame = 0;

function boxAt(t) {
  const index = marks.findIndex(mark => mark.t > t);
  const prev = index < 0 ? marks[marks.length - 1] : marks[index - 1];
  const next = index < 0 ? null : marks[index];
  if (!prev?.box) return null;
  if (!next?.box) return prev.box;
  const fraction = (t - prev.t) / (next.t - prev.t);
  return prev.box.map((value, i) => value + (next.box[i] - value) * fraction);
}
function render() {
  ctx.clearRect(0, 0, layer.width, layer.height);
  const box = drag?.box ?? boxAt(video.currentTime);
  if (!visible.checked || !box) return;
  const [x, y, w, h] = box.map((value, i) => value * (i % 2 ? layer.height : layer.width));
  const scale = Math.max(1, layer.width / 960);
  ctx.strokeStyle = '#101810';
  ctx.lineWidth = 5 * scale;
  ctx.strokeRect(x, y, w, h);
  ctx.strokeStyle = '#56ff46';
  ctx.lineWidth = 2 * scale;
  ctx.strokeRect(x, y, w, h);
}
function refresh() {
  seek.value = video.currentTime;
  byId('time').value = video.currentTime.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' s';
  render();
}
function animate() {
  refresh();
  if (!video.paused && !video.ended) frame = requestAnimationFrame(animate);
}
function addMark(box) {
  const t = Math.round(video.currentTime * 1000) / 1000;
  history.push(marks);
  marks = marks.filter(mark => mark.t !== t).concat({t, box}).sort((a,b) => a.t-b.t);
  undo.disabled = false;
  status.textContent = marks.length + ' marcação(ões) nesta sessão.';
  render();
}
function point(event) {
  const rect = layer.getBoundingClientRect();
  const clamp = value => Math.max(0, Math.min(1, value));
  return [clamp((event.clientX-rect.left)/rect.width),clamp((event.clientY-rect.top)/rect.height)];
}
byId('file').onchange = event => {
  const file = event.target.files[0];
  if (!file) return;
  video.pause();
  if (url) URL.revokeObjectURL(url);
  marks = []; history = []; drag = null;
  play.disabled = seek.disabled = undo.disabled = hide.disabled = true;
  byId('stage').hidden = true;
  status.textContent = 'Abrindo gravação…';
  url = URL.createObjectURL(file);
  video.src = url;
};
video.onloadedmetadata = () => {
  if (!Number.isFinite(video.duration) || !video.videoWidth) return;
  layer.width = video.videoWidth;
  layer.height = video.videoHeight;
  seek.max = video.duration;
  byId('stage').hidden = false;
  play.disabled = seek.disabled = hide.disabled = false;
  status.textContent = 'Vídeo aberto. Arraste sobre um personagem para criar a primeira marcação.';
  refresh();
};
video.onerror = () => { status.textContent = 'O navegador não conseguiu abrir esta gravação. Selecione outro MP4.'; };
video.onseeked = refresh;
video.onplay = () => { play.textContent = 'Pausar'; cancelAnimationFrame(frame); animate(); };
video.onpause = video.onended = () => { play.textContent = 'Reproduzir'; cancelAnimationFrame(frame); refresh(); };
seek.oninput = () => { video.currentTime = Number(seek.value); };
play.onclick = async () => {
  if (!video.paused) { video.pause(); return; }
  try { await video.play(); }
  catch { status.textContent = 'Não foi possível reproduzir este arquivo.'; }
};
visible.onchange = render;
hide.onclick = () => { video.pause(); addMark(null); };
undo.onclick = () => {
  marks = history.pop();
  undo.disabled = history.length === 0;
  status.textContent = 'Última marcação desfeita.';
  render();
};
layer.onpointerdown = event => {
  if (event.button !== 0 || drag || !video.videoWidth || video.seeking) return;
  video.pause();
  drag = {start: point(event), id: event.pointerId};
  layer.setPointerCapture(event.pointerId);
};
layer.onpointermove = event => {
  if (drag?.id !== event.pointerId) return;
  const [x,y] = point(event), [a,b] = drag.start;
  drag.box = [Math.min(x,a),Math.min(y,b),Math.abs(x-a),Math.abs(y-b)];
  render();
};
layer.onpointerup = event => {
  if (drag?.id !== event.pointerId) return;
  layer.onpointermove(event);
  const box = drag.box;
  drag = null;
  if (box[2] > .003 && box[3] > .003) addMark(box);
  else render();
};
layer.onlostpointercapture = () => { drag = null; render(); };
</script>
</html>
